name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, chat-background]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28 + CMake 3.22.1
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Copy provider customization template
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Build native deps (proot, sandbox rootfs, rclone)
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minis-chat-background-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
